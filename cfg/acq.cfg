// config file for beacon-acq
// not all options are changeable by restart

// settings related to threshold  / trigger control
// These all can be set without restarting
control:
{
   // scaler goals for each channel, desired rate ( in Hz)
   coinc_scaler_goal = {
     ch0 : 500;
     ch1 : 500;
     ch2 : 500;
     ch3 : 500;
     ch4 : 500;
     ch5 : 500;
     ch6 : 500;
     ch7 : 500;
    };

   // fixed thresholds for each channel (in case of use_fixed_thresholds)
   fixed_coinc_threshold = {
     ch0 : 15;
     ch1 : 15;
     ch2 : 15;
     ch3 : 15;
     ch4 : 40;
     ch5 : 40;
     ch6 : 40;
     ch7 : 40;
    };

   //the channels allowed to participate in the trigger
   coinc_trigger_mask = 0xf;

   // scaler goals for each beam, desired rate ( in Hz)
   phased_scaler_goal = {
     bm0 : 200;
     bm1 : 200;
     bm2 : 200;
     bm3 : 200;
     bm4 : 200;
     bm5 : 200;
     bm6 : 200;
     bm7 : 200;
     bm8 : 200;
     bm9 : 200;
     bm10 : 200;
     bm11 : 200;
     bm12 : 200;
     bm13 : 200;
     bm14 : 200;
     bm15 : 200;
     bm16 : 200;
     bm17 : 200;
     bm18 : 200;
     bm19 : 200;
    };

   // fixed thresholds for each beam (in case of use_fixed_thresholds)
   fixed_phased_threshold = {
     bm0 : 1000;
     bm1 : 1000;
     bm2 : 1000;
     bm3 : 1000;
     bm4 : 1000;
     bm5 : 1000;
     bm6 : 1000;
     bm7 : 1000;
     bm8 : 1000;
     bm9 : 1000;
     bm10 : 1000;
     bm11 : 1000;
     bm12 : 1000;
     bm13 : 1000;
     bm14 : 1000;
     bm15 : 1000;
     bm16 : 1000;
     bm17 : 1000;
     bm18 : 1000;
     bm19 : 1000;
    };

   //the beams allowed to participate in the trigger
   phased_trigger_mask_lower = 0xfffff;
   phased_trigger_mask_upper = 0x0;

   // use fixed thresholds (don't servo!) 
   use_fixed_thresholds = 1;

   // 1Hz scaler weight 
   scaler_weight_1Hz = 0.500000;

   // coinc trig/servo threshold fraction 
   coinc_servo_scaler_frac = 0.900000;

   // phased trig/servo threshold fraction 
   phased_servo_scaler_frac = 0.500000;

   // use 100 Hz scalers instead of 100 mHz scalers...
   use_100Hz_scalers = 0;

   // coinc pid loop proportional term
   k_p = 10;

   // coinc pid loop integral term
   k_i = 0;

   // coinc pid loop differential term
   k_d = 0;

   // phased pid loop proportional term
   k_p_p = 10;

   // phased pid loop integral term
   k_i_p = 0;

   // phased pid loop differential term
   k_d_p = 0;

   // puts a floor on the coinc thresholds
   min_coinc_threshold=5;

   // puts a floor on the phased thresholds
   min_phased_threshold=5;

   // max threshold increase per step 
   max_threshold_increase=5;

   //monitoring interval, for PID loop (in seconds)
   monitor_interval = 1;

   // software trigger interval (in seconds)
   sw_trigger_interval = 1;

   // randomize sw trigger interval (using exponential distribution)
   randomize_sw_trigger = 0;

   //File to persist the status info (primarily for saving thresholds between restarts)
   status_save_file = "/beacon/last.st.bin"

   // load thresholds from status file on start.
   load_thresholds_from_status_file=1

   // use vpp for trigger
   vpp_mode=0;

   // coincidence window, in units of clock ticks (125 MHz, so 8 ns/tick)
   coinc_window=3;

   // concidences required this is a >, so 0 means 1 channel, 1 means 2 cvhannels, etc.
   ncoinc=3;

   // enable phased trigger
   enable_phased_trig=1;

   // enable coincidence trigger
   enable_coinc_trig=0;

   // enable pps trigger
   enable_pps_trig=1;

   // pps delay (ns)
   pps_delay=0.000000;

};

// settings related to the acquisition
// Not all of these can be set without restarting
device: 
{
  //spi devices, main (triggering) and secondary (non-triggering)
  spi_device =  { M: "/dev/spidev1.0", S: "/dev/spidev0.0"; } 

  // gpios for interrupts
  gpio_int = { M: 44 , S: 89 ; }

  //spi enable, negative for active high
  spi_enable = -61;

  //swap the two boards (M <->S )
  swap_boards = 0;

  // circular buffer capacity. In-memory storage in between acquisition and writing. Requires restart.
  buffer_capacity = 256;

  //the length of a waveform, in samples. 
  waveform_length = 512;

  //the pretrigger window length, in hardware units
  pretrigger = 6;

  // fixed gain setting per channel (see table 21 of HMCAD1511 datasheet). Use -1 to equalize to target_rms. 
  gain_codes = { M: [ 0,0,0,0,5,5,5,5 ], S: [ 5,5,5,5,5,5,5,5] }; 

  //target rms for equalized channels
  target_rms = 5.000000;

};

//settings related to output
output: 
{
  // Run file, used to persist run number
  run_file = "/beacon/runfile";

  // output directory, data will go here
  output_directory = "/data/daq/" ;

  //print to screen interval (0 to disable)
  print_interval = 10;

  // run length, in seconds
  run_length = 10800; 

  //events per output file
  events_per_file = 200;

  //statuses per output file
  status_per_file = 100;

  //realtime priority setting. If 0, will use non-realtime priority. Otherwise, SCHED_FIFO is used with the given priority
  realtime_priority = 20;

  // Colon separated list of paths to copy (recursively) into run dir at start of run
  copy_paths_to_rundir = "/proc/loadavg";

  //Whether or not to copy configs into run dir
  copy_configs = 1;
};

